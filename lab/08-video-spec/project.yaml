# 视频工程演示（设计见 docs/design/DESIGN-video-project.md）
# 改文案、数字、颜色、出场时机、位置微调都在这里改，不用碰代码；
# 构建：uv run vlab-build lab/08-video-spec/project.yaml [--style lab/08-video-spec/styles/cloudsea.yaml]
id: spec-demo
title: 天空为什么是蓝的
style: styles/landscape.yaml
voice: {name: zh-CN-YunxiNeural, rate: "+8%"}

scenes:
  - id: intro
    template: title_card
    narration: 天空为什么是蓝的？答案藏在一个四次方里。
    params:
      kicker: 瑞利散射 · 三十秒
      title: 天空为什么是蓝的
      subtitle: 答案藏在一个四次方里
    cues:
      title: {on: 天空}
      subtitle: {on: 四}        # 配音把"四次方"切成了 四 / 次 / 方

  - id: compare
    template: bar_compare
    narration: 蓝光的波长短，红光的波长长；按四次方算，蓝光被散射的强度，差不多是红光的六倍。
    params:
      title: 蓝光散射约为红光 6 倍
      caption: 散射强度 ∝ 1 / 波长⁴
      bars:
        - {name: blue, label: 蓝光 450 纳米, value: 5.86, value_label: "5.86", color: accent2}
        - {name: red, label: 红光 700 纳米, value: 1.0, value_label: "1", color: accent1}
      callout: 约 6 倍
    cues:
      bars.blue: {on: 蓝光}
      bars.red: {on: 红光}
      caption: {on: 四}
      callout: {on: 六}
    overrides:                       # 精修：相当于剪辑软件里把元素拖一下
      callout: {dy: 0.4}

  - id: points
    template: bullet_list
    narration: 记住三点：分子比波长小得多，波长越短散射越强，所以满天都是散射开的蓝光。
    params:
      title: 三个要点
      items: [分子比光的波长小一千多倍, 波长越短，散射越强, 满天都是散射开的蓝光]
    cues:
      items.0: {on: 分子}
      items.1: {on: 越}          # "越短"被切成 越 / 短，第一个"越"就是这里
      items.2: {on: 满天}
