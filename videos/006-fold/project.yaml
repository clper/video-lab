        - {fold: 10, label: 10.2 厘米, sub: 一只手掌, kind: hand}
        - {fold: 17, label: 13.1 米, sub: 四层楼, kind: building}
        - {fold: 23, label: 838.9 米, sub: 哈利法塔 828 米, kind: tower}

  - id: S21
    renderer: remotion
    card: foldRuler
    fx: {dipOut: 0.10, dipFrames: 10}
    hold: 8
    beats: 4
    params:
      total: 42
      fold: 30
      sky: true
      kicker: 02 · 尺　THE RULER
      note: 云、客机、积雨云 —— 纸柱一直在头顶
      landmarks:
        - {fold: 10, label: 10.2 厘米, sub: 一只手掌, kind: hand}
        - {fold: 17, label: 13.1 米, sub: 四层楼, kind: building}
        - {fold: 23, label: 838.9 米, sub: 哈利法塔 828 米, kind: tower}

  - id: S22
    renderer: remotion
