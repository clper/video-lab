    hold: 5
    text: 第三十次，107 公里。
    beats: 2
    params:
      total: 42
      fold: 30
      kicker: 02 · 尺　THE RULER
      note: 第 30 折 = 107.4 公里
      landmarks:
        - {fold: 10, label: 10.2 厘米, sub: 一只手掌, kind: hand}
        - {fold: 17, label: 13.1 米, sub: 四层楼, kind: building}
