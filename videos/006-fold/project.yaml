  # ── 章三 · 墙 104.4–140.4（174–234 拍）─────────────────────────────
  # 这里从“算得出来”转到“折不下去”：先把纸柱压成一条线，再把线横过来当尺，
  # 然后交给一个人（2002 / 加州 / 16 岁 / 1200 米 / 8 小时 / 12 折）。
  - id: S30
    renderer: remotion
    card: foldFormula
    fx: {dipIn: 0.55, dipFrames: 9}       # 章三首镜
    hold: 6
    text: 这个数字是算出来的，不是折出来的。
    beats: 3
    params:
      kicker: 03 · 墙　THE WALL
      note: 没有任何一只手折到过这里 —— 这是算式给的数。

  - id: S31
    renderer: remotion
