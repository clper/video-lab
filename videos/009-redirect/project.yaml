# 009《他比我重一倍，我借了他的力》——火柴人 VS 物理（试水）。剧本和分镜见 SCRIPT.md（2026-10-27 项目负责人确认）。
# 无旁白，拍格模式：120 BPM（每拍 0.5 秒），24 镜共 240 拍 = 120 秒，关键动作落在小节第一拍。
# 每一镜都是 custom 渲染器：shots/stick.py 读 motion.py 算好的这一镜动作数据，交给镜头卡 stickScene 画。
# 跑法：先 uv run python videos/009-redirect/motion.py（算动作、切镜头数据、出音效事件表），再 uv run vlab-build 这个文件。
# 配乐不在这里：项目负责人剪辑时从曲库加（2026-10-27 定），所以成片只有音效。
id: 009-redirect
title: 他比我重一倍，我借了他的力
style: styles/neon.yaml
aspect: landscape
fps: 30
grid: {bpm: 120}
x-remotion: &remotion ../../toolkit/vlab/render/remotion/src
audio:
  music: false
  sfx_file: build/009-redirect/sfx_events.json
  sfx_db: 0
  lufs: -14
scenes:
  - {id: S01, hold: 8, renderer: custom, script: shots/stick.py, params: {shot: S01, fx: {dipIn: 1.0, dipFrames: 24}}, deps: [build/009-redirect/shots/S01.json, *remotion]}
