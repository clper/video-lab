# 009《他比我重一倍，我借了他的力》——火柴人 VS 物理（试水）。剧本和分镜见 SCRIPT.md（2026-10-27 项目负责人确认）。
# 无旁白，拍格模式：120 BPM（每拍 0.5 秒），24 镜共 240 拍 = 120 秒，关键动作落在小节第一拍（时刻表见 README）。
# 先算数据、再按镜头画：precompute 跑 motion.py（choreo.py 编排动作 + 布偶物理），按时间轴把动作切成每镜一份 JSON，
# 每一镜用 params_files 交给公共镜头卡 stickScene 画（beats 是这一镜里真实发生的动作数，只给 vlab-review 看，不进镜头指纹）。
# 跑法：uv run vlab-build 这个文件（choreo.py 或 toolkit/vlab/stick 改了会自动重算动作，数据没变的镜头直接复用）。
# 配乐不在这里：项目负责人剪辑时从曲库加（2026-10-27 定），所以成片只有音效。
id: 009-redirect
title: 他比我重一倍，我借了他的力
style: styles/neon.yaml
aspect: landscape
fps: 30
grid: {bpm: 120}
# 手持微动开着：镜头一直有一点呼吸；星尘、扫光、切点白闪都关
fx_default: {handheld: true, stardust: false, sweep: false, flash: false}
precompute: {script: motion.py, inputs: [choreo.py, ../../toolkit/vlab/stick]}
audio:
  music: false
  sfx_file: build/009-redirect/sfx_events.json
  sfx_db: 0
  lufs: -14
# 体检破例（STYLE-RHYTHM：观感优先，破了哪条写清楚）：vlab-review 照样列出来，但不算没过
review:
  waive:
    same_run: 全片是一场连续的打斗，24 镜都由 stickScene 画。每镜的画面读法都在变（进场、对峙、出拳、定格讲物理、被打飞、慢镜头、过肩摔……），镜内还有机位变化；判据是"画面读法变没变"，和 007、008 一样。
    shot_max:
      S19: 退后、刨地、冲锋一气呵成，切开会断掉冲锋的蓄势。
      S24: 落点字幕的远景。STYLE-IMPACT 规矩 1 要求落点在最后 8–12 秒给出，两条冲突时以规矩 1 为准。
    shot_avg: 本片 5.0 秒。分镜按剧本 24 镜（4–6 秒一镜），镜内动作密，镜内还有硬切（S12 末尾切到金）。
    motion: 细线画在黑底上，动起来的像素本来就少，同风格、满屏都在打的样片（research/visual/15 样片 B）也只有 1.79。已经加了跟拍、主光、背景雾和手持微动（第一版 0.73 → 1.03）。
    # 低于 1.0 的 10 秒段都是剧本里有意安静的地方，再往里塞动作就违背剧本的情绪设计，按观感优先保留
    motion_10s:
      10–20s: 16 秒撞上以后定格 6 秒讲物理（S05）。
      40–50s: 音乐停下来，小个子躺着喘气、羽毛飘下（S10–S11）。
      60–70s: 站起来深呼吸、拳头逼近放慢，67 秒起定格讲挡和拨（S13–S15）。
      100–110s: 平拍在地以后的余震和喘气（S21 尾–S22）。
      110–120s: 拉起来以后的落点远景（S24，规矩 1 要求落点停够 8 秒）。
# 配乐提示：vlab-build 据此生成 renders/009-redirect_cues.md 和 .srt（剪映可导入当标记轨），剪配乐时对拍用
music_cues:
  - {t: 0.5, to: 4, picture: 大块头的四步重脚步（0.5、1.5、2.5、3.5 各一步）, sound: 脚步就是节拍}
  - {t: 16, to: 22, picture: 拳头打在交叉的小臂上，定格 6 秒（两支力箭头）, sound: 重拍，然后音乐收住、只剩嗡鸣}
  - {t: 22, picture: 解除定格，小个子被打飞, sound: 音乐回来}
  - {t: 32, to: 33.5, picture: 连打四拳（每半拍一拳）, sound: 四下鼓点}
  - {t: 38, picture: 一掌推飞, sound: 重拍}
  - {t: 42, to: 57, picture: 小个子躺在地上, sound: 音乐停（42–57 几乎无声）}
  - {t: 47, picture: 羽毛飘下来}
  - {t: 50, picture: 一巴掌扇空}
  - {t: 52, to: 57, picture: 慢镜头重放：气流绕开手掌}
  - {t: 57, picture: 小个子站起来, sound: 新的音乐起：冷静、有决心}
  - {t: 64, to: 67, picture: 拳头逼近、放慢, sound: 收住}
  - {t: 67, to: 72, picture: 定格（挡和拨的箭头）, sound: 收住}
  - {t: 72.1, picture: 轻轻一拨, sound: 重新起}
  - {t: 80, picture: 大块头自己扑倒, sound: 重拍}
  - {t: 87, to: 93, picture: 往后退、刨地、全速冲锋（90.6 起越来越快）, sound: 推到最高}
  - {t: 93.5, to: 99.6, picture: 抓住、扛上后背、翻过去（慢镜头）}
  - {t: 99.6, to: 100, picture: 落地前, sound: 留一拍静音}
  - {t: 100, picture: 平拍在地上, sound: 最重的一拍}
  - {t: 108, to: 112, picture: 伸手、拉起来, sound: 收、温暖}
  - {t: 112.6, to: 120, picture: 落点字幕, sound: 收尾}
