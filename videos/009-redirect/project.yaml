# 009《他比我重一倍，我借了他的力》——火柴人 VS 物理（试水）。剧本和分镜见 SCRIPT.md（2026-10-27 项目负责人确认）。
# 无旁白，拍格模式：120 BPM（每拍 0.5 秒），24 镜共 240 拍 = 120 秒，关键动作落在小节第一拍（时刻表见 README）。
# 每一镜都是 custom 渲染器：shots/stick.py 读 motion.py 算好的这一镜动作数据，交给公共镜头卡 stickScene 画
# （component 申报的就是这张卡，beats 是这一镜里真实发生的动作数，都只给 vlab-review 看，不进镜头指纹）。
# 跑法：先 uv run python videos/009-redirect/motion.py（算动作、切镜头数据、出音效事件表），再 uv run vlab-build 这个文件。
# 配乐不在这里：项目负责人剪辑时从曲库加（2026-10-27 定），所以成片只有音效。
#
# 体检破例（STYLE-RHYTHM：观感优先，破了哪条写清楚）：
#   同款视觉连镜上限 2 —— 全片是一场连续的打斗，24 镜都由 stickScene 画。每镜的画面读法都在变（进场、对峙、出拳、
#   定格讲物理、被打飞、慢镜头、过肩摔……），镜内还有机位变化；判据是"画面读法变没变"，和 007、008 一样。
#   单镜 ≤5.2 秒 —— S19（6 秒）是退后、刨地、冲锋一气呵成，切开会断掉冲锋的蓄势；
#   S24（8 秒）是落点字幕的远景：STYLE-IMPACT 规矩 1 要求落点在最后 8–12 秒给出，两条冲突时以规矩 1 为准。
#   平均镜长 ≤4.5 秒 —— 本片 5.0 秒：分镜按剧本 24 镜（4–6 秒一镜），镜内动作密，镜内还有硬切（S12 末尾切到金）。
#   motion 基线（STYLE-IMPACT 规矩 3：全片 ≥1.5、每 10 秒段 ≥1.0）—— 本片实测全片 1.03，没有 2 秒以上的死帧（最长 0.07 秒）。
#   细线画在黑底上，动起来的像素本来就少：同风格的打斗样片（research/visual/15 样片 B，满屏都在打）也只有 1.79。
#   低于 1.0 的段落都是剧本里有意安静的地方：定格讲物理（S05、S15）、音乐停下来躺着喘气（S10–S11）、
#   砸地以后的余震（S22）、落点远景（S24）。已经加了跟拍、主光、背景雾和手持微动（第一版 0.73 → 1.03），
#   再往安静的段落里塞动作就违背剧本的情绪设计，按观感优先保留。
id: 009-redirect
title: 他比我重一倍，我借了他的力
style: styles/neon.yaml
aspect: landscape
fps: 30
grid: {bpm: 120}
x-remotion: &remotion ../../toolkit/vlab/render/remotion/src
audio:
  music: false
  sfx_file: build/009-redirect/sfx_events.json
  sfx_db: 0
  lufs: -14
scenes:
  # S01：四步重脚步
  - {id: S01, hold: 8, beats: 4, component: stickScene, renderer: custom, script: shots/stick.py, params: {shot: S01, fx: {dipIn: 1.0, dipFrames: 24}}, deps: [build/009-redirect/shots/S01.json, *remotion]}
  # S02：标签亮起、金抬头
  - {id: S02, hold: 8, beats: 2, component: stickScene, renderer: custom, script: shots/stick.py, params: {shot: S02}, deps: [build/009-redirect/shots/S02.json, *remotion]}
  # S03：两人摆架势、推近
  - {id: S03, hold: 8, beats: 2, component: stickScene, renderer: custom, script: shots/stick.py, params: {shot: S03}, deps: [build/009-redirect/shots/S03.json, *remotion]}
